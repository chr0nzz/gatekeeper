{{template "base" .}}
{{define "title"}}Add a passkey - GateKeeper{{end}}
{{define "content"}}
<div class="card">
  <h1>Add a passkey</h1>
  <p>A passkey lets you sign in using your device's fingerprint, face, or PIN.</p>
  <div id="error" class="alert alert-error" style="display:none"></div>
  <div id="success" class="alert alert-success" style="display:none">Passkey registered successfully.</div>
  <label>Passkey name (optional)
    <input type="text" id="passkey-name" placeholder="My laptop" value="My passkey">
  </label>
  <button id="btn-register" class="btn btn-primary">Register passkey</button>
</div>
<script src="/static/js/passkey.js"></script>
<script>
document.getElementById('btn-register').addEventListener('click', async () => {
  const name = document.getElementById('passkey-name').value;
  await beginPasskeyRegister(
    '/register/passkey/begin',
    '/register/passkey/finish?name=' + encodeURIComponent(name),
    document.getElementById('error'),
    document.getElementById('success')
  );
});
</script>
{{end}}
