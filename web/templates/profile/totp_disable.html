{{template "base" .}}
{{define "title"}}Disable authenticator - GateKeeper{{end}}
{{define "content"}}
<div class="card">
  <h1>Disable authenticator</h1>
  <p>Enter your current authenticator code to confirm removal of two-factor authentication.</p>
  {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
  <form method="POST" action="/profile/totp/disable">
    <label>Authenticator code
      <input type="text" name="code" required autofocus maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    </label>
    <button type="submit" class="btn btn-danger">Disable two-factor authentication</button>
  </form>
</div>
{{end}}
