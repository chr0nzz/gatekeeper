<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup - GateKeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/static/css/main.css">
<script>(function(){var t=localStorage.getItem('gk_theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>
<div class="auth-wrap bg-grid">
  <div class="auth-top">
    <div class="gk-mark lg">
      <div class="gk-glyph"><i></i></div>
      <div class="gk-name"><b>Gate</b><span>Keeper</span></div>
    </div>
  </div>
  <div class="auth-card">
    <h1>Create admin account</h1>
    <p class="lede">You're running GateKeeper for the first time. Set up your admin credentials to get started.</p>
    {{if .Error}}<div class="alert alert-err" style="margin-bottom:18px"><b>{{.Error}}</b></div>{{end}}
    <form method="POST" action="{{$.AdminBase}}/setup" style="margin-top:4px">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label class="field">
        <span class="field-label">Admin email</span>
        <input class="input" type="email" name="email" required autofocus autocomplete="email" placeholder="admin@example.com">
      </label>
      <label class="field">
        <span class="field-label">Password <span style="color:var(--tx-3);font-weight:400">(12+ characters)</span></span>
        <input class="input" type="password" name="password" required minlength="12" autocomplete="new-password" placeholder="••••••••••••">
      </label>
      <label class="field">
        <span class="field-label">Confirm password</span>
        <input class="input" type="password" name="confirm" required minlength="12" autocomplete="new-password" placeholder="••••••••••••">
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;height:40px;font-size:14px;margin-top:4px">Create account</button>
    </form>
  </div>
</div>
<script src="/static/js/theme.js"></script>
</body>
</html>
