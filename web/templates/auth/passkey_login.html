{{template "base" .}}
{{define "title"}}Sign in with passkey - GateKeeper{{end}}
{{define "content"}}
<div class="auth-wrap bg-grid">
  <div class="auth-top">
    <div class="gk-mark">
      <div class="gk-glyph"><i></i></div>
      <div class="gk-name"><b>Gate</b><span>Keeper</span></div>
    </div>
  </div>
  <div class="auth-card" style="text-align:center">
    <div id="gk-passkey-error" class="alert alert-err" style="display:none;margin-bottom:18px;text-align:left"></div>
    <div style="width:56px;height:56px;margin:8px auto 20px;border-radius:14px;background:var(--ac-bg);border:1px solid var(--ac-bd);display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.5" style="width:28px;height:28px"><circle cx="8" cy="9" r="4"/><path d="M14 9h6M17 9v6M2 20c0-3 2.7-5 6-5"/></svg>
    </div>
    <h1>Use a passkey</h1>
    <p class="lede" style="margin-bottom:20px">Authenticate with your device's fingerprint, face, or PIN.</p>
    <button id="gk-passkey-login-btn"
      data-begin="/login/passkey/begin"
      data-finish="/login/passkey/finish"
      class="btn btn-primary" style="width:100%;height:40px;font-size:14px">Authenticate</button>
    <div class="auth-foot" style="justify-content:center;margin-top:18px">
      <a href="/login">Sign in with password instead</a>
    </div>
  </div>
</div>
<script src="/static/js/passkey.js"></script>
<script src="/static/js/theme.js"></script>
{{end}}
