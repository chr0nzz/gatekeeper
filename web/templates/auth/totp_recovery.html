{{template "base" .}}
{{define "title"}}Recovery code - GateKeeper{{end}}
{{define "content"}}
<div class="auth-wrap bg-grid">
  <div class="auth-top">
    <div class="gk-mark">
      <div class="gk-glyph"><i></i></div>
      <div class="gk-name"><b>Gate</b><span>Keeper</span></div>
    </div>
  </div>
  <div class="auth-card">
    <a href="/login/totp" class="btn btn-quiet btn-xs" style="margin-bottom:14px;padding:4px 0">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px"><path d="M10 12L6 8l4-4"/></svg>
      Back to authenticator code
    </a>
    <h1>Recovery code</h1>
    <p class="lede">Enter one of your saved recovery codes.</p>
    {{if .Error}}<div class="alert alert-err" style="margin-bottom:18px"><b>{{.Error}}</b></div>{{end}}
    <form method="POST" action="/login/totp/recovery">
      <label class="field">
        <span class="field-label">Recovery code</span>
        <input class="input mono" type="text" name="code" required autofocus autocomplete="off" placeholder="xx-xx-xx-xx-xx">
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;height:40px;font-size:14px">Verify</button>
    </form>
  </div>
</div>
<script src="/static/js/theme.js"></script>
{{end}}
