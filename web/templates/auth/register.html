{{template "base" .}}
{{define "title"}}Create account - GateKeeper{{end}}
{{define "content"}}
<div class="auth-wrap bg-grid">
  <div class="auth-top" style="justify-content:center">
    <div class="gk-mark">
      <div class="gk-glyph"><i></i></div>
      <div class="gk-name"><b>Gate</b><span>Keeper</span></div>
    </div>
  </div>
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="lede">You have been invited to create a GateKeeper account.</p>

    {{if .Error}}<div class="alert alert-err" style="margin-bottom:16px"><b>{{.Error}}</b></div>{{end}}

    <form method="POST" action="/register" style="margin-top:20px">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="invite_token" value="{{.Token}}">

      <label class="field">
        <span class="field-label">Email address</span>
        {{if .Email}}
        <input class="input" type="email" name="email" value="{{.Email}}" readonly style="background:var(--bg-2);color:var(--tx-2);cursor:not-allowed">
        {{else}}
        <input class="input" type="email" name="email" required autofocus autocomplete="email" placeholder="you@example.com">
        {{end}}
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input class="input" type="password" name="password" required {{if .Email}}autofocus{{end}} autocomplete="new-password" placeholder="At least 12 characters" minlength="12">
      </label>

      <label class="field">
        <span class="field-label">Confirm password</span>
        <input class="input" type="password" name="confirm_password" required autocomplete="new-password" placeholder="Repeat your password">
      </label>

      <button type="submit" class="btn btn-primary" style="width:100%;height:42px;font-size:14px;margin-top:4px">
        Create account
      </button>
    </form>

    <div class="auth-foot" style="justify-content:center;margin-top:16px">
      <a href="/login">Already have an account? Sign in</a>
    </div>
  </div>
</div>
<script src="/static/js/theme.js"></script>
{{end}}
