{{template "base" .}}
{{define "title"}}Reset password - GateKeeper{{end}}
{{define "content"}}
<div class="card">
  <h1>Reset your password</h1>
  {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    <div class="links"><a href="/forgot-password">Request a new reset link</a></div>
  {{else}}
    <form method="POST" action="/reset-password">
      <input type="hidden" name="token" value="{{.Token}}">
      <label>New password (12+ characters)
        <input type="password" name="password" required autofocus minlength="12" autocomplete="new-password">
      </label>
      <label>Confirm new password
        <input type="password" name="confirm" required minlength="12" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary">Set new password</button>
    </form>
  {{end}}
</div>
{{end}}
